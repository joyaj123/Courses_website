<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<style>
    body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
    }

    .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
    }
</style>
</head>

<body class="bg-slate-100 text-slate-900">

<!-- HEADER -->
<header class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl shadow-sm flex items-center justify-between px-6 h-16">

    <div class="flex items-center gap-3">

        <span class="material-symbols-outlined text-indigo-600">
            terminal
        </span>

        <span class="text-xl font-bold tracking-tighter">
            StudyGo
        </span>

    </div>

</header>

<div class="flex min-h-screen pt-16">

<!-- SIDEBAR -->
<aside class="hidden lg:flex flex-col p-4 space-y-2 h-screen fixed left-0 top-0 pt-20 bg-slate-50 w-72">

    <nav class="space-y-1">

        <a href="/learner-dashboard"
           class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200 rounded-lg transition text-sm font-medium">

            <span class="material-symbols-outlined">
                dashboard
            </span>

            <span>Dashboard</span>

        </a>

        <a href="/course-catalog"
           class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200 rounded-lg transition text-sm font-medium">

            <span class="material-symbols-outlined">
                school
            </span>

            <span>Courses</span>

        </a>

        <a href="/profile-page"
           class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200 rounded-lg transition text-sm font-medium">

            <span class="material-symbols-outlined">
                settings
            </span>

            <span>Settings</span>

        </a>

    </nav>

</aside>

<!-- MAIN -->
<main class="lg:pl-72 w-full">

    <div class="max-w-6xl mx-auto px-6 py-10">

        <!-- TITLE -->
        <div class="mb-8">

            <h1 class="text-3xl font-black tracking-tight mb-2">
                Continue Learning
            </h1>

            <p class="text-slate-500">
                Pick up exactly where you left off.
            </p>

        </div>

        <!-- COURSES -->
        <div id="coursesContainer"
             class="grid grid-cols-1 md:grid-cols-2 gap-6">

        </div>

    </div>

</main>

</div>

<script>

async function loadCourses() {

    try {

        const response = await fetch('/api/courses');

        const courses = await response.json();

        const container = document.getElementById('coursesContainer');

        container.innerHTML = '';

        courses.forEach(course => {

            container.innerHTML += `

                <a href="/courses/${course.course_id}/details"
                   class="bg-white rounded-2xl overflow-hidden border border-slate-200 hover:shadow-xl transition-all duration-300 block">

                    <div class="h-36 bg-gradient-to-br from-indigo-600 to-indigo-900 p-4 flex items-end">

                        <span class="bg-white/20 backdrop-blur text-white text-xs font-bold px-3 py-1 rounded-full uppercase">
                            ${course.difficulty || 'Beginner'}
                        </span>

                    </div>

                    <div class="p-5">

                        <h3 class="font-black text-lg mb-2">
                            ${course.title}
                        </h3>

        

                        <div class="flex justify-between text-xs font-semibold mb-2">

                            <span>Progress</span>

                            <span class="text-indigo-600">
                                ${course.progress || 0}%
                            </span>

                        </div>

                        <div class="h-2 bg-slate-200 rounded-full overflow-hidden">

                            <div class="h-full bg-indigo-600 rounded-full"
                                 style="width:${course.progress || 0}%">
                            </div>

                        </div>

                    </div>

                </a>

            `;
        });

    } catch (error) {

        console.error('Error loading courses:', error);

    }

}

loadCourses();

</script>

</body>
</html>
