<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<style>
    body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
    }

    .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
    }
</style>
</head>

<body class="bg-slate-100 text-slate-900">

<!-- HEADER -->
<header class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl shadow-sm flex items-center justify-between px-6 h-16">

    <div class="flex items-center gap-3">

        <span class="material-symbols-outlined text-indigo-600">
            terminal
        </span>

        <span class="text-xl font-bold tracking-tighter">
            StudyGo
        </span>

    </div>

</header>

<div class="flex min-h-screen pt-16">

<!-- SIDEBAR -->
<aside class="hidden lg:flex flex-col p-4 space-y-2 h-screen fixed left-0 top-0 pt-20 bg-slate-50 w-72">

    <nav class="space-y-1">

        <a href="/manage-courses"
           class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200 rounded-lg transition text-sm font-medium">

            <span class="material-symbols-outlined">
                menu_book
            </span>

            <span>Manage Courses</span>

        </a>

        <a href="/course-catalog"
           class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200 rounded-lg transition text-sm font-medium">

            <span class="material-symbols-outlined">
                school
            </span>

            <span>Courses</span>

        </a>

        <a href="/profile-page"
           class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200 rounded-lg transition text-sm font-medium">

            <span class="material-symbols-outlined">
                settings
            </span>

            <span>Settings</span>

        </a>

    </nav>

</aside>

<!-- MAIN -->
<main class="lg:pl-72 w-full">

    <div class="max-w-6xl mx-auto px-6 py-10">

        <!-- TITLE -->
        <div class="mb-8">

            <h1 class="text-3xl font-black tracking-tight">
                Admin Dashboard
            </h1>

        </div>

        <!-- STATS -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- TOTAL COURSES -->
            <div class="bg-white rounded-2xl border border-slate-200 p-7">

                <div class="flex items-center gap-2 text-xs uppercase tracking-widest font-bold text-indigo-600 mb-4">

                    <span class="material-symbols-outlined text-sm">
                        menu_book
                    </span>

                    Total Courses

                </div>

                <h3 id="totalCourses"
                    class="text-4xl font-black mb-2">

                    0

                </h3>

                <p class="text-slate-500 text-sm">
                    Active courses on the platform
                </p>

            </div>

            <!-- TOTAL STUDENTS -->
            <div class="bg-white rounded-2xl border border-slate-200 p-7">

                <div class="flex items-center gap-2 text-xs uppercase tracking-widest font-bold text-emerald-600 mb-4">

                    <span class="material-symbols-outlined text-sm">
                        group
                    </span>

                    Students

                </div>

                <h3 id="totalStudents"
                    class="text-4xl font-black mb-2">

                    0

                </h3>

                <p class="text-slate-500 text-sm">
                    Registered learners
                </p>

            </div>

        </section>

    </div>

</main>

</div>

<script>

async function loadDashboardStats() {

    try {

        const response = await fetch('/course-manage');

        const data = await response.json();

        // TOTAL COURSES
        document.getElementById('totalCourses').textContent =
            data.stats.total_courses;

        // TOTAL STUDENTS
        document.getElementById('totalStudents').textContent =
            data.stats.total_users;

    } catch (error) {

        console.error('Error loading dashboard stats:', error);

    }

}

loadDashboardStats();

</script>

</body>
</html>
