<script>
    async function loadCourses(){
        try{
             const token = localStorage.getItem("token");
             console.log("TOKEN:", token);
            const res=await fetch("/my-courses",{
                method:"GET",
                headers: {
                "Authorization": `Bearer ${token}`
            }
            });
             if (!res.ok) {
            throw new Error("Failed to fetch courses");
        }
        
        const data= await res.json();
        const container = document.querySelector(".grid");

        container.innerHTML = ""; // clear static content

        data.courses.forEach(course => {
            const card = `
<div class="flex flex-col bg-surface-container-lowest rounded-2xl border border-outline-variant/15 hover:shadow-lg transition-all group">
    
    <div class="p-6 flex flex-col flex-grow">

        <h4 class="text-xl font-bold text-on-surface mb-2">
            ${course.title}
        </h4>

        <p class="text-sm text-on-surface-variant mb-6 flex-grow">
            ${course.description}
        </p>

       

            <span class="text-xs font-bold text-outline uppercase tracking-wider">
                ${course.difficulty}
            </span>

        <button onclick="goToDetails(${course.course_id})"
            class="mt-4 text-primary font-bold text-sm flex items-center gap-1">
            View Details
        </button>

    </div>
</div>
`;


            container.innerHTML += card;
        });
    }catch(error){
        console.error("error loading courses",error);
    }
    }
    function goToDetails(courseId){
    window.location.href = `/courses/${courseId}/details`;
}
    
    loadCourses();
    let activeButton = null;

async function filterCourses(category, btn) {

    const token = localStorage.getItem("token");

   
    if (activeButton) {
        activeButton.classList.remove("bg-indigo-600", "text-white");
        activeButton.classList.add("bg-gray-200");
    }

   
    if (btn) {
        btn.classList.remove("bg-gray-200");
        btn.classList.add("bg-indigo-600", "text-white");
        activeButton = btn;
    }

    let url = "/my-courses";

    if (category) {
        url += `?category=${category}`;
    }

    const res = await fetch(url, {
        method: "GET",
        headers: {
            "Authorization": `Bearer ${token}`
        }
    });

    const data = await res.json();

    const container = document.getElementById("courseGrid");
    container.innerHTML = "";

    data.courses.forEach(course => {
        container.innerHTML += `
            <div class="flex flex-col bg-surface-container-lowest rounded-2xl border border-outline-variant/15 hover:shadow-lg transition-all group">
                <div class="p-6 flex flex-col flex-grow">

                    <h4 class="text-xl font-bold text-on-surface mb-2">
                        ${course.title}
                    </h4>

                    <p class="text-sm text-on-surface-variant mb-6 flex-grow">
                        ${course.description}
                    </p>


                        <span class="text-xs font-bold text-outline uppercase tracking-wider">
                            ${course.difficulty}
                        </span>
                    

                    <button onclick="goToDetails(${course.course_id})"
                        class="mt-4 text-primary font-bold text-sm flex items-center gap-1">
                        View Details
                    </button>

                </div>
            </div>
        `;
    });
}

</script>
